name: pdf
description: A professional PDF vault with nested groups, search, and themes.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # الأيقونات
  cupertino_icons: ^1.0.8

  # قاعدة البيانات المحلية
  sqflite: ^2.4.1
  path: ^1.9.0

  # إدارة المسارات والتخزين
  path_provider: ^2.1.5

  # اختيار ملفات PDF من الجهاز
  file_picker: ^8.1.7

  # إدارة الحالة (للثيم)
  provider: ^6.1.2

  # عارض PDF
  pdfrx: ^1.0.0

  # حفظ إعدادات الثيم
  shared_preferences: ^2.2.2

  # تنسيق التواريخ والأحجام
  intl: ^0.19.0

flutter:
  uses-material-design: true