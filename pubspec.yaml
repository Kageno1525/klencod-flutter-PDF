name: pdf_vault
description: "Personal PDF Vault - مستودع PDF"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ─── Storage & Database ───
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3

  # ─── File Handling ───
  file_picker: ^8.1.7

  # ─── PDF ───
  pdfrx: ^1.1.3

  # ─── Image Processing ───
  image: ^4.3.0

  # ─── UI & Animations ───
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0

  # ─── Utilities ───
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # assets:
  #   - assets/cover.png