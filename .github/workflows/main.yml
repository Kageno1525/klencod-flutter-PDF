name: Analyze & Test

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.27.0'
          cache: true

      - name: 📦 Pub Get
        run: flutter pub get

      - name: 🔍 Analyze
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "::error::Flutter analyze failed — see analyze.log"
            exit 1
          fi

      - name: 🧪 Test
        run: flutter test --reporter expanded

      - name: 📤 Upload analyze log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: analyze-log
          path: analyze.log
          retention-days: 7
          if-no-files-found: ignore