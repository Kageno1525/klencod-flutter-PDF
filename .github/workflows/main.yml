name: Build & Release

on:
  push:
    branches: [ main, master, dev ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'apk'
        type: choice
        options:
          - apk
          - aab
          - both

env:
  FLUTTER_VERSION: '3.27.1'
  JAVA_VERSION: '17'

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Analyze + Test
  # ─────────────────────────────────────────────
  quality:
    name: 🔍 Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: 📦 Get dependencies
        run: flutter pub get

      - name: 🔍 Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: 🧪 Test
        run: flutter test --coverage
        continue-on-error: true

      - name: 📤 Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 7

  # ─────────────────────────────────────────────
  # Job 2: Build Android (APK + AAB)
  # ─────────────────────────────────────────────
  build-android:
    name: 🤖 Build Android
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: 📦 Get dependencies
        run: flutter pub get

      - name: 🧹 Clean
        run: flutter clean

      - name: 📦 Re-get dependencies
        run: flutter pub get

      - name: 🔨 Build APK (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: 🔨 Build APK (universal)
        run: flutter build apk --release

      - name: 🔨 Build AAB
        run: flutter build appbundle --release

      - name: 📋 Build info
        run: |
          echo "### 📦 Build Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          ls -lh build/app/outputs/flutter-apk/*.apk >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
          ls -lh build/app/outputs/bundle/release/*.aab >> $GITHUB_STEP_SUMMARY 2>/dev/null || true

      - name: 📤 Upload split APKs
        uses: actions/upload-artifact@v4
        with:
          name: apk-split
          path: build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: 📤 Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-universal
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: 📤 Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

  # ─────────────────────────────────────────────
  # Job 3: Attach to GitHub Release
  # ─────────────────────────────────────────────
  release:
    name: 🚀 Publish Release
    runs-on: ubuntu-latest
    needs: build-android
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: 📥 Download all APKs
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 📋 List files
        run: find artifacts -type f -exec ls -lh {} \;

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/apk-split/app-armeabi-v7a-release.apk
            artifacts/apk-split/app-arm64-v8a-release.apk
            artifacts/apk-split/app-x86_64-release.apk
            artifacts/apk-universal/app-release.apk
            artifacts/aab/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}